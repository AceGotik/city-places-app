<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Admin Panel</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

h2{margin-top:0;}

input, select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.add-btn{ background:#22c55e; color:white; }
.delete-btn{ background:#ef4444; color:white; }
.edit-btn{ background:#3b82f6; color:white; }

.card{
background:rgba(255,255,255,0.08);
padding:12px;
border-radius:12px;
margin-top:10px;
}

.admin-nav{
display:flex;
gap:10px;
margin-bottom:20px;
}

.admin-nav button{
flex:1;
background:rgba(255,255,255,0.08);
color:white;
}

.admin-nav button.active{
background:#3b82f6;
}

.tab{ display:none; }
.tab.active{ display:block; }

hr{opacity:.2;margin:30px 0;}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div id="accessMessage"></div>

<div id="adminContent" style="display:none;">

<div class="admin-nav">
  <button onclick="showTab('places')" id="tabPlaces" class="active">Заведения</button>
  <button onclick="showTab('banners')" id="tabBanners">Баннеры</button>
  <button onclick="showTab('stats')" id="tabStats">Статистика</button>
</div>

<!-- ================= PLACES ================= -->

<div id="tab-places" class="tab active">

<h3 id="formTitle">Добавить заведение</h3>

<input id="name" placeholder="Название">
<input id="average_price" placeholder="Средний чек">
<input id="street" placeholder="Улица">

<select id="type">
  <option value="1">Бар</option>
  <option value="2">Кафе</option>
  <option value="3">Ресторан</option>
  <option value="4">Фастфуд</option>
</select>

<input id="work_time" placeholder="График работы">
<input id="image" placeholder="URL изображения">
<input id="latitude" placeholder="Широта">
<input id="longitude" placeholder="Долгота">

<button class="add-btn" onclick="savePlace()">Сохранить</button>

<hr>

<input id="adminSearch" placeholder="Поиск заведения...">

<div id="placesList"></div>

</div>

<!-- ================= BANNERS ================= -->

<div id="tab-banners" class="tab">

<h3>Добавить баннер</h3>

<input id="bannerImage" placeholder="URL картинки">
<input id="bannerLink" placeholder="Ссылка (необязательно)">
<button class="add-btn" onclick="addBanner()">Добавить</button>

<hr>

<div id="bannersList"></div>

</div>

<!-- ================= STATS ================= -->

<div id="tab-stats" class="tab">
<h3>Статистика</h3>
<div id="statsContainer"></div>
</div>

</div>

<script>
Telegram.WebApp.expand();

const API_BASE = "https://city-places-app-production.up.railway.app";
const telegramId = Telegram.WebApp.initDataUnsafe?.user?.id;
const ADMIN_ID = 315901039;

let editingId = null;

if(!telegramId){
    document.getElementById("accessMessage").innerHTML = "Открой через Telegram.";
}
else if(telegramId != ADMIN_ID){
    document.getElementById("accessMessage").innerHTML = "Нет доступа.";
}
else{
    document.getElementById("adminContent").style.display = "block";
    loadPlaces();
    loadBannersAdmin();
    loadStats();
}

// ================= TABS =================

function showTab(tab){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".admin-nav button").forEach(b=>b.classList.remove("active"));

  document.getElementById("tab-"+tab).classList.add("active");
  document.getElementById("tab"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");
}

// ================= PLACES =================

function savePlace(){

  const data = {
    name: name.value.trim(),
    average_price: average_price.value ? parseInt(average_price.value) : null,
    street: street.value.trim() || null,
    type: type.value || null,
    work_time: work_time.value.trim() || null,
    image: image.value.trim() || null,
    latitude: latitude.value ? parseFloat(latitude.value) : null,
    longitude: longitude.value ? parseFloat(longitude.value) : null
  };

  if(editingId){

    fetch(API_BASE + `/admin/places/${editingId}`,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "telegram-id": telegramId
      },
      body: JSON.stringify(data)
    })
    .then(()=>{
      editingId = null;
      formTitle.innerText = "Добавить заведение";
      clearInputs();
      loadPlaces();
    });

  }else{

    fetch(API_BASE + "/places",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data)
    })
    .then(()=>{
      clearInputs();
      loadPlaces();
    });

  }
}

function loadPlaces(){
  fetch(API_BASE + "/places")
  .then(res=>res.json())
  .then(data=>{

    const query = adminSearch.value?.toLowerCase() || "";
    const container = placesList;
    container.innerHTML = "";

    data
      .filter(p=>p.name.toLowerCase().includes(query))
      .forEach(place=>{

        container.innerHTML += `
          <div class="card">
            <b>${place.name}</b><br>
            💰 ${place.average_price || "-"} ₽<br>
            📍 ${place.street || "-"}<br>
            ⭐ ${place.rating || 0}<br><br>

            <button class="edit-btn" onclick="editPlace(${place.id})">
              Редактировать
            </button>

            <button class="delete-btn" onclick="deletePlace(${place.id})">
              Удалить
            </button>
          </div>
        `;
      });
  });
}

function editPlace(id){
  fetch(API_BASE + "/places")
  .then(res=>res.json())
  .then(data=>{
    const p = data.find(x=>x.id===id);
    if(!p) return;

    name.value = p.name;
    average_price.value = p.average_price || "";
    street.value = p.street || "";
    type.value = p.type || "";
    work_time.value = p.work_time || "";
    image.value = p.image || "";
    latitude.value = p.latitude || "";
    longitude.value = p.longitude || "";

    editingId = id;
    formTitle.innerText = "Редактирование";
  });
}

function deletePlace(id){
  if(!confirm("Удалить заведение?")) return;

  fetch(API_BASE + `/admin/places/${id}`,{
    method:"DELETE",
    headers:{ "telegram-id": telegramId }
  })
  .then(()=>loadPlaces());
}

adminSearch.addEventListener("input", loadPlaces);

function clearInputs(){
  document.querySelectorAll("#tab-places input").forEach(i=>i.value="");
}

// ================= BANNERS =================

function loadBannersAdmin(){
  fetch(API_BASE + "/banners")
  .then(res=>res.json())
  .then(data=>{
    bannersList.innerHTML = "";

    data.forEach(b=>{
      bannersList.innerHTML += `
        <div class="card">
          <img src="${b.image}" width="100%"><br>
          ${b.link || ""}<br><br>
          <button class="delete-btn" onclick="deleteBanner(${b.id})">
            Удалить
          </button>
        </div>
      `;
    });
  });
}

function addBanner(){
  const data = {
    image: bannerImage.value,
    link: bannerLink.value || null
  };

  fetch(API_BASE + "/admin/banners",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "telegram-id": telegramId
    },
    body: JSON.stringify(data)
  })
  .then(()=>{
    bannerImage.value="";
    bannerLink.value="";
    loadBannersAdmin();
  });
}

function deleteBanner(id){
  if(!confirm("Удалить баннер?")) return;

  fetch(API_BASE + "/admin/banners/"+id,{
    method:"DELETE",
    headers:{ "telegram-id": telegramId }
  })
  .then(()=>loadBannersAdmin());
}

// ================= STATS =================

function loadStats(){
  fetch(API_BASE + "/places")
  .then(res=>res.json())
  .then(data=>{
    statsContainer.innerHTML = `
      <div class="card">
        Всего заведений: <b>${data.length}</b>
      </div>
    `;
  });
}
</script>

</body>
</html>
