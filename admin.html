<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Admin Panel</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

h2{margin-top:0;}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.add-btn{
background:#22c55e;
color:white;
}

.delete-btn{
background:#ef4444;
color:white;
margin-top:6px;
}

.card{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:12px;
margin-top:10px;
}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div id="accessMessage"></div>

<div id="adminContent" style="display:none;">

<h3>Добавить заведение</h3>

<input id="name" placeholder="Название">
<input id="average_price" placeholder="Средний чек">
<input id="street" placeholder="Улица">
<input id="type" placeholder="Тип (Бар/Кафе...)">
<input id="work_time" placeholder="График работы">
<input id="image" placeholder="URL изображения">
<input id="latitude" placeholder="Широта (55.75)">
<input id="longitude" placeholder="Долгота (37.61)">

<button class="add-btn" onclick="addPlace()">Добавить</button>

<h3>Список заведений</h3>
<div id="placesList"></div>

</div>

<script>

Telegram.WebApp.expand();

const API_BASE = "https://city-places-app-production.up.railway.app";
const telegramId = Telegram.WebApp.initDataUnsafe?.user?.id;

// ВСТАВЬ СВОЙ ID
const ADMIN_ID = 315901039;

if(!telegramId){
    document.getElementById("accessMessage").innerHTML = "Открой через Telegram.";
}
else if(telegramId != ADMIN_ID){
    document.getElementById("accessMessage").innerHTML = "Нет доступа.";
}
else{
    document.getElementById("adminContent").style.display = "block";
    loadPlaces();
}

function addPlace(){

    const data = {
        name: document.getElementById("name").value,
        average_price: parseInt(document.getElementById("average_price").value) || null,
        street: document.getElementById("street").value,
        type: document.getElementById("type").value,
        work_time: document.getElementById("work_time").value,
        image: document.getElementById("image").value,
        latitude: parseFloat(document.getElementById("latitude").value) || null,
        longitude: parseFloat(document.getElementById("longitude").value) || null
    };

    fetch(API_BASE + "/places",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res=>res.json())
    .then(()=>{
        clearInputs();
        loadPlaces();
    });
}

function deletePlace(id){
    fetch(API_BASE + `/admin/places/${id}`,{
        method:"DELETE",
        headers:{
            "telegram-id": telegramId
        }
    })
    .then(res=>res.json())
    .then(()=>{
        loadPlaces();
    });
}

function loadPlaces(){
    fetch(API_BASE + "/places")
    .then(res=>res.json())
    .then(data=>{
        const container = document.getElementById("placesList");
        container.innerHTML = "";

        data.forEach(place=>{
            container.innerHTML += `
                <div class="card">
                    <b>${place.name}</b><br>
                    💰 ${place.average_price || "-"} ₽<br>
                    📍 ${place.street || "-"}<br>
                    ⭐ ${place.rating || 0}<br>
                    <button class="delete-btn" onclick="deletePlace(${place.id})">
                        Удалить
                    </button>
                </div>
            `;
        });
    });
}

function clearInputs(){
    document.querySelectorAll("input").forEach(i=>i.value="");
}

</script>

</body>
</html>
