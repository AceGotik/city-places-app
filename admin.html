<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Admin</title>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

input, select {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button {
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.add { background:#22c55e; color:white; }
.delete { background:#ef4444; color:white; }
.edit { background:#3b82f6; color:white; }

.card {
    background:#1e293b;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
}
</style>
</head>
<body>

<h2>Admin Panel</h2>

<div id="access"></div>

<div id="adminContent" style="display:none;">

<h3>Добавить заведение</h3>

<input id="name" placeholder="Название">
<input id="price" type="number" placeholder="Средний чек">
<input id="street" placeholder="Улица">
<select id="type">
    <option>Бар</option>
    <option>Кафе</option>
    <option>Ресторан</option>
    <option>Фастфуд</option>
</select>
<input id="time" placeholder="10:00-23:00">
<input id="rating" type="number" placeholder="Рейтинг">

<button class="add" onclick="addPlace()">Добавить</button>

<h3>Список заведений</h3>
<div id="places"></div>

</div>

<script>
const tg = window.Telegram.WebApp;
const userId = tg.initDataUnsafe?.user?.id;

// ВСТАВЬ СЮДА СВОЙ TELEGRAM ID
const ADMIN_ID = 123456789;

if (userId != ADMIN_ID) {
    document.getElementById("access").innerHTML = "<h3>Доступ запрещен</h3>";
} else {
    document.getElementById("adminContent").style.display = "block";
    loadPlaces();
}

function loadPlaces() {
    fetch("/places")
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById("places");
        container.innerHTML = "";

        data.forEach(place => {
            container.innerHTML += `
                <div class="card">
                    <b>${place.name}</b><br>
                    💰 ${place.average_price}₽<br>
                    📍 ${place.street}<br>
                    🏷 ${place.type}<br>
                    ⏰ ${place.work_time}<br>
                    🔥 ${place.rating}°<br>
                    <button class="delete" onclick="deletePlace(${place.id})">Удалить</button>
                </div>
            `;
        });
    });
}

function addPlace() {
    fetch("/places", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name: name.value,
            average_price: parseInt(price.value),
            street: street.value,
            type: type.value,
            work_time: time.value,
            rating: parseInt(rating.value)
        })
    }).then(() => {
        loadPlaces();
    });
}

function deletePlace(id) {
    fetch(`/places/${id}`, {method:"DELETE"})
    .then(() => loadPlaces());
}
</script>

</body>
</html>
