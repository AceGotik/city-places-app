<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Admin Panel</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

input, select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.add-btn{ background:#22c55e; color:white; }
.delete-btn{ background:#ef4444; color:white; }
.edit-btn{ background:#3b82f6; color:white; }

.card{
background:rgba(255,255,255,0.08);
padding:14px;
border-radius:12px;
margin-top:12px;
}

.photo-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px;
}

.photo-grid img{
width:100%;
border-radius:8px;
}
hr{opacity:.2;margin:25px 0;}
</style>
</head>

<body>

<h2>Admin Panel</h2>
<div id="accessMessage"></div>
<div id="adminContent" style="display:none;">

<h3 id="formTitle">Добавить заведение</h3>

<input id="name" placeholder="Название">
<input id="average_price" placeholder="Средний чек">
<input id="street" placeholder="Улица">
<select id="type">
  <option value="1">Бар</option>
  <option value="2">Кафе</option>
  <option value="3">Ресторан</option>
  <option value="4">Фастфуд</option>
</select>
<input id="work_time" placeholder="График работы">
<input id="latitude" placeholder="Широта">
<input id="longitude" placeholder="Долгота">

<button class="add-btn" onclick="savePlace()">Сохранить</button>

<hr>

<input id="adminSearch" placeholder="Поиск...">
<div id="placesList"></div>

</div>

<script>
Telegram.WebApp.expand();

const API_BASE="https://city-places-app-production.up.railway.app";
const telegramId=Telegram.WebApp.initDataUnsafe?.user?.id;
const ADMIN_ID=315901039;
let editingId=null;

if(!telegramId){
 accessMessage.innerText="Открой через Telegram";
}else if(telegramId!=ADMIN_ID){
 accessMessage.innerText="Нет доступа";
}else{
 adminContent.style.display="block";
 loadPlaces();
}

function savePlace(){
 const data={
  name:name.value.trim(),
  average_price:average_price.value?parseInt(average_price.value):null,
  street:street.value||null,
  type:type.value||null,
  work_time:work_time.value||null,
  latitude:latitude.value?parseFloat(latitude.value):null,
  longitude:longitude.value?parseFloat(longitude.value):null
 };

 if(editingId){
  fetch(API_BASE+`/admin/places/${editingId}`,{
   method:"PUT",
   headers:{
    "Content-Type":"application/json",
    "telegram-id":telegramId
   },
   body:JSON.stringify(data)
  }).then(()=>{
   editingId=null;
   clearInputs();
   loadPlaces();
  });
 }else{
  fetch(API_BASE+"/places",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(data)
  }).then(()=>{
   clearInputs();
   loadPlaces();
  });
 }
}

function loadPlaces(){
 fetch(API_BASE+"/places")
 .then(r=>r.json())
 .then(data=>{
  const q=adminSearch.value?.toLowerCase()||"";
  placesList.innerHTML="";

  data.filter(p=>p.name.toLowerCase().includes(q))
  .forEach(place=>{

   placesList.innerHTML+=`
   <div class="card">

    <b>${place.name}</b><br>
    💰 ${place.average_price||"-"} ₽<br>
    ⭐ ${place.rating||0}<br><br>

    <button class="edit-btn" onclick="editPlace(${place.id})">
     Редактировать
    </button>

    <button class="delete-btn" onclick="deletePlace(${place.id})">
     Удалить
    </button>

    <hr>

    <b>Фото заведения:</b>
    <input type="file" multiple onchange="uploadPlacePhotos(${place.id},this)">
    <div class="photo-grid" id="placePhotos-${place.id}"></div>

    <hr>

    <b>Фото меню:</b>
    <input type="file" multiple onchange="uploadMenuPhotos(${place.id},this)">
    <div class="photo-grid" id="menuPhotos-${place.id}"></div>

   </div>
   `;

   loadPlacePhotos(place.id);
   loadMenuPhotos(place.id);
  });
 });
}

function editPlace(id){
 fetch(API_BASE+"/places")
 .then(r=>r.json())
 .then(data=>{
  const p=data.find(x=>x.id===id);
  if(!p)return;

  name.value=p.name;
  average_price.value=p.average_price||"";
  street.value=p.street||"";
  type.value=p.type||"";
  work_time.value=p.work_time||"";
  latitude.value=p.latitude||"";
  longitude.value=p.longitude||"";

  editingId=id;
 });
}

function deletePlace(id){
 if(!confirm("Удалить?"))return;
 fetch(API_BASE+`/admin/places/${id}`,{
  method:"DELETE",
  headers:{"telegram-id":telegramId}
 }).then(loadPlaces);
}

function uploadPlacePhotos(id,input){
 const formData=new FormData();
 for(let file of input.files){
  formData.append("files",file);
 }

 fetch(API_BASE+`/admin/places/${id}/photos`,{
  method:"POST",
  headers:{"telegram-id":telegramId},
  body:formData
 }).then(()=>loadPlacePhotos(id));
}

function loadPlacePhotos(id){
 fetch(API_BASE+`/admin/places/${id}/photos`)
 .then(r=>r.json())
 .then(data=>{
  const container=document.getElementById(`placePhotos-${id}`);
  container.innerHTML="";
  data.forEach(p=>{
   container.innerHTML+=`
    <div>
     <img src="${p.image}">
     <button class="delete-btn"
       onclick="deletePhoto(${p.id},${id})">X</button>
    </div>
   `;
  });
 });
}

function deletePhoto(photoId,placeId){
 fetch(API_BASE+`/admin/photos/${photoId}`,{
  method:"DELETE",
  headers:{"telegram-id":telegramId}
 }).then(()=>loadPlacePhotos(placeId));
}

function uploadMenuPhotos(id,input){
 const formData=new FormData();
 for(let file of input.files){
  formData.append("files",file);
 }

 fetch(API_BASE+`/admin/places/${id}/menu`,{
  method:"POST",
  headers:{"telegram-id":telegramId},
  body:formData
 }).then(()=>loadMenuPhotos(id));
}

function loadMenuPhotos(id){
 fetch(API_BASE+`/admin/places/${id}/menu`)
 .then(r=>r.json())
 .then(data=>{
  const container=document.getElementById(`menuPhotos-${id}`);
  container.innerHTML="";
  data.forEach(p=>{
   container.innerHTML+=`
    <div>
     <img src="${p.image}">
     <button class="delete-btn"
       onclick="deleteMenuPhoto(${p.id},${id})">X</button>
    </div>
   `;
  });
 });
}

function deleteMenuPhoto(photoId,placeId){
 fetch(API_BASE+`/admin/menu/${photoId}`,{
  method:"DELETE",
  headers:{"telegram-id":telegramId}
 }).then(()=>loadMenuPhotos(placeId));
}

adminSearch.addEventListener("input",loadPlaces);

function clearInputs(){
 document.querySelectorAll("input").forEach(i=>i.value="");
}
</script>

</body>
</html>
