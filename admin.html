<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{padding:8px 12px;margin:5px;border:none;border-radius:6px;cursor:pointer}
.card{background:#1e293b;padding:10px;margin:10px 0;border-radius:10px}
</style>
</head>
<body>

<h2>Admin Panel</h2>

<input id="name" placeholder="Название">
<input id="price" type="number" placeholder="Средний чек">
<input id="street" placeholder="Улица">
<select id="type">
<option>Бар</option>
<option>Кафе</option>
<option>Ресторан</option>
<option>Фастфуд</option>
</select>
<input id="time" placeholder="10:00-23:00">
<input id="rating" type="number" placeholder="Рейтинг">
<input id="image" placeholder="URL картинки">

<button onclick="addPlace()">Добавить</button>

<h3>Все заведения</h3>
<div id="places"></div>

<script>
loadPlaces()

function loadPlaces(){
fetch("/places")
.then(res=>res.json())
.then(data=>{
const container=document.getElementById("places")
container.innerHTML=""
data.forEach(p=>{
container.innerHTML+=`
<div class="card">
<b>${p.name}</b><br>
💰 ${p.average_price}<br>
📍 ${p.street}<br>
🔥 ${p.rating}<br>
<button onclick="deletePlace(${p.id})">Удалить</button>
</div>
`
})
})
}

function addPlace(){
fetch("/places",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:name.value,
average_price:price.value?parseInt(price.value):null,
street:street.value,
type:type.value,
work_time:time.value,
rating:rating.value?parseInt(rating.value):0,
image:image.value
})
}).then(()=>loadPlaces())
}

function deletePlace(id){
fetch("/places/"+id,{method:"DELETE"})
.then(()=>loadPlaces())
}
</script>

</body>
</html>
