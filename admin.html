<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Admin Panel</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding:20px;
overflow-x:hidden;
max-width:100vw;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.add-btn{background:#22c55e;color:white;}
.delete-btn{background:#ef4444;color:white;}
.edit-btn{background:#3b82f6;color:white;}

.card{
background:rgba(255,255,255,0.08);
padding:12px;
border-radius:12px;
margin-top:10px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
flex:1;
background:rgba(255,255,255,0.08);
color:white;
}

.tabs button.active{
background:#3b82f6;
}

.tab{display:none;}
.tab.active{display:block;}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
overflow:auto;
}

.modal-content{
background:#1e293b;
padding:20px;
border-radius:12px;
width:95%;
max-width:500px;
max-height:90vh;
overflow-y:auto;
}

.photo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.photo-grid img{
width:100%;
border-radius:8px;
max-height:150px;
object-fit:cover;
}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div class="tabs">
<button id="tabBtnPlaces" class="active" onclick="showTab('places')">Заведения</button>
<button id="tabBtnBanners" onclick="showTab('banners')">Баннеры</button>
</div>

<!-- ================= PLACES ================= -->

<div id="tab-places" class="tab active">

<h3>Добавить заведение</h3>

<input id="newName" placeholder="Название">
<input id="newPrice" placeholder="Средний чек">
<input id="newStreet" placeholder="Улица">

<select id="newType">
<option value="">Тип</option>
<option value="1">Бар</option>
<option value="2">Кафе</option>
<option value="3">Ресторан</option>
<option value="4">Фастфуд</option>
</select>

<input id="newWorkTime" placeholder="График">
<input id="newLatitude" placeholder="Широта">
<input id="newLongitude" placeholder="Долгота">

<button class="add-btn" onclick="addPlace()">Добавить</button>

<hr>

<div id="placesList"></div>

</div>

<!-- ================= BANNERS ================= -->

<div id="tab-banners" class="tab">
<h3>Добавить баннер</h3>
<input id="bannerImage" placeholder="URL картинки">
<input id="bannerLink" placeholder="Ссылка">
<button class="add-btn" onclick="addBanner()">Добавить</button>
<div id="bannersList"></div>
</div>

<!-- ================= MODAL ================= -->

<div class="modal" id="editModal">
<div class="modal-content">

<h3>Редактирование</h3>

<input id="editName" placeholder="Название">
<input id="editPrice" placeholder="Средний чек">
<input id="editStreet" placeholder="Улица">

<select id="editType">
<option value="">Тип</option>
<option value="1">Бар</option>
<option value="2">Кафе</option>
<option value="3">Ресторан</option>
<option value="4">Фастфуд</option>
</select>

<input id="editWorkTime" placeholder="График">
<input id="editLatitude" placeholder="Широта">
<input id="editLongitude" placeholder="Долгота">

<button onclick="hideKeyboard()">Скрыть клавиатуру</button>

<h4>Добавить фото заведения</h4>
<input type="file" id="placePhotos" multiple>

<h4>Добавить фото меню</h4>
<input type="file" id="menuPhotos" multiple>

<h4>Текущие фото</h4>
<div id="currentPhotos" class="photo-grid"></div>

<button class="add-btn" onclick="saveEdit()">Сохранить</button>
<button class="delete-btn" onclick="closeModal()">Закрыть</button>

</div>
</div>

<script>

Telegram.WebApp.expand();

const API = "https://city-places-app-production.up.railway.app";
const telegramId = Telegram.WebApp.initDataUnsafe?.user?.id;
let editingId = null;

// TABS
function showTab(tab){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
document.getElementById("tab-"+tab).classList.add("active");
document.getElementById("tabBtn"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");
}

// LOAD PLACES
function loadPlaces(){
fetch(API+"/places")
.then(r=>r.json())
.then(data=>{
placesList.innerHTML="";
data.forEach(p=>{
placesList.innerHTML+=`
<div class="card">
<b>${p.name}</b><br>
💰 ${p.average_price||"-"} ₽<br>
📍 ${p.street||"-"}<br>
⭐ ${p.rating||0}<br><br>
<button class="edit-btn" onclick="openEdit(${p.id})">Редактировать</button>
<button class="delete-btn" onclick="deletePlace(${p.id})">Удалить</button>
</div>`;
});
});
}

function addPlace(){
fetch(API+"/places",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:newName.value,
average_price:parseInt(newPrice.value)||null,
street:newStreet.value||null,
type:newType.value||null,
work_time:newWorkTime.value||null,
latitude:parseFloat(newLatitude.value)||null,
longitude:parseFloat(newLongitude.value)||null
})
}).then(()=>loadPlaces());
}

function deletePlace(id){
fetch(API+`/admin/places/${id}`,{
method:"DELETE",
headers:{"telegram-id":telegramId}
}).then(()=>loadPlaces());
}

// OPEN EDIT
function openEdit(id){
editingId=id;
fetch(API+"/places")
.then(r=>r.json())
.then(data=>{
const p=data.find(x=>x.id===id);
editName.value=p.name;
editPrice.value=p.average_price||"";
editStreet.value=p.street||"";
editType.value=p.type||"";
editWorkTime.value=p.work_time||"";
editLatitude.value=p.latitude||"";
editLongitude.value=p.longitude||"";
editModal.style.display="flex";
loadCurrentPhotos();
});
}

function closeModal(){
editModal.style.display="none";
}

// SAVE EDIT
async function saveEdit(){

await fetch(API+`/admin/places/${editingId}`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"telegram-id":telegramId
},
body:JSON.stringify({
name:editName.value,
average_price:parseInt(editPrice.value)||null,
street:editStreet.value||null,
type:editType.value||null,
work_time:editWorkTime.value||null,
latitude:parseFloat(editLatitude.value)||null,
longitude:parseFloat(editLongitude.value)||null
})
});

await uploadPhotos();
await uploadMenu();
await loadCurrentPhotos();

closeModal();
loadPlaces();
}

async function uploadPhotos(){
const files=placePhotos.files;
if(files.length===0)return;
const fd=new FormData();
for(let f of files){fd.append("files",f);}
await fetch(API+`/admin/places/${editingId}/photos`,{
method:"POST",
headers:{"telegram-id":telegramId},
body:fd
});
}

async function uploadMenu(){
const files=menuPhotos.files;
if(files.length===0)return;
const fd=new FormData();
for(let f of files){fd.append("files",f);}
await fetch(API+`/admin/places/${editingId}/menu`,{
method:"POST",
headers:{"telegram-id":telegramId},
body:fd
});
}

// LOAD CURRENT PHOTOS
function loadCurrentPhotos(){

fetch(API+`/admin/places/${editingId}/photos`)
.then(r=>r.json())
.then(data=>{
currentPhotos.innerHTML="";

data.forEach(photo=>{

currentPhotos.innerHTML+=`
<div style="position:relative">
  <img src="${API}${photo.image}">
  <button 
    style="
      position:absolute;
      top:5px;
      right:5px;
      background:#ef4444;
      color:white;
      border:none;
      border-radius:6px;
      padding:4px 6px;
      font-size:12px;
    "
    onclick="deletePhoto(${photo.id}, '${photo.type}')"
  >
    ✕
  </button>
</div>
`;

});

});
}

// BANNERS
function loadBanners(){
fetch(API+"/banners")
.then(r=>r.json())
.then(data=>{
bannersList.innerHTML="";
data.forEach(b=>{
bannersList.innerHTML+=`
<div class="card">
<img src="${b.image}" width="100%"><br>
${b.link||""}<br>
<button class="delete-btn" onclick="deleteBanner(${b.id})">Удалить</button>
</div>`;
});
});
}

function addBanner(){
fetch(API+"/admin/banners",{
method:"POST",
headers:{
"Content-Type":"application/json",
"telegram-id":telegramId
},
body:JSON.stringify({
image:bannerImage.value,
link:bannerLink.value||null
})
}).then(()=>loadBanners());
}

function deleteBanner(id){
fetch(API+`/admin/banners/${id}`,{
method:"DELETE",
headers:{"telegram-id":telegramId}
}).then(()=>loadBanners());
}

function deletePhoto(id,type){

let url="";

if(type==="place"){
  url=API+`/admin/place_photo/${id}`;
}
else if(type==="menu"){
  url=API+`/admin/menu/${id}`;
}

fetch(url,{
method:"DELETE",
headers:{"telegram-id":telegramId}
})
.then(()=>loadCurrentPhotos());

}  

// HIDE KEYBOARD
function hideKeyboard(){
document.activeElement.blur();
Telegram.WebApp.closeKeyboard();
}

loadPlaces();
loadBanners();

</script>
</body>
</html>
