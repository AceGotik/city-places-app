<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Places</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  color: white;
}

.header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 0 15px 30px;
}

.card {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
  animation: fadeIn 0.4s ease forwards;
  opacity: 0;
}

.card h2 {
  margin: 0 0 6px 0;
  font-size: 18px;
}

.category {
  font-size: 13px;
  color: #8e8e93;
  margin-bottom: 8px;
}

.description {
  font-size: 14px;
  margin-bottom: 12px;
}

.button {
  background: #2ea6ff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  color: white;
  font-size: 13px;
  cursor: pointer;
}

.button:active {
  transform: scale(0.96);
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="header">📍 City Places</div>
<div class="container" id="places"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const API_URL = "YOUR_RAILWAY_URL/places";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("places");

    if (data.length === 0) {
      container.innerHTML = "Пока нет заведений";
      return;
    }

    data.forEach((place, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (index * 0.1) + "s";

      card.innerHTML = `
        <h2>${place.name}</h2>
        <div class="category">${place.category}</div>
        <div class="description">${place.description}</div>
        <button class="button">Был здесь</button>
      `;

      container.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById("places").innerHTML = "Ошибка загрузки";
  });
</script>

</body>
</html>
