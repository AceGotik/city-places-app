<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>City Places</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:#0b0f1a;
  color:white;
  padding-bottom:100px;
}

/* ==== ADS ==== */
.ads{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px;
}

.ad-card{
  min-width:160px;
  height:90px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.ad-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.ad-card span{
  position:absolute;
  bottom:8px;
  left:10px;
  font-size:12px;
  font-weight:bold;
}

/* ==== MAP TITLE ==== */
.map-title{
  background:white;
  color:black;
  text-align:center;
  font-size:60px;
  font-weight:900;
  padding:20px 0;
}

/* ==== CATEGORY BAR ==== */
.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:10px 16px;
  background:#111827;
}

.cat{
  text-align:center;
  font-size:12px;
}

.cat img{
  width:50px;
  height:50px;
  border-radius:10px;
}

/* ==== FILTERS ==== */
.filters{
  display:flex;
  gap:10px;
  padding:16px;
}

.chip{
  padding:8px 18px;
  border-radius:20px;
  border:none;
  background:#1f2937;
  color:white;
}

.chip.active{
  background:#2563eb;
}

/* ==== GRID ==== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:0 16px;
}

.card{
  background:#111827;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.price-badge{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,0.7);
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

.star{
  position:absolute;
  top:8px;
  right:8px;
  font-size:18px;
}

.card-content{
  padding:10px;
}

.card-content h3{
  font-size:16px;
}

.card-content p{
  font-size:12px;
  color:#9ca3af;
}

/* ==== BOTTOM NAV ==== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f172a;
  display:flex;
  justify-content:space-around;
  padding:14px 0;
  border-top:1px solid #1f2937;
}

.bottom-nav div{
  text-align:center;
  font-size:12px;
}

.bottom-nav span{
  display:block;
  font-size:20px;
}
</style>
</head>

<body>

<!-- ADS -->
<div class="ads">
  <div class="ad-card">
    <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
    <span>-40% на пиццу</span>
  </div>
  <div class="ad-card">
    <img src="https://images.unsplash.com/photo-1548365328-8b849e1f0ef9">
    <span>Вторая бесплатно</span>
  </div>
</div>

<!-- MAP -->
<div class="map-title">MAP</div>

<!-- CATEGORIES -->
<div class="categories">
  <div class="cat">
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
    Бургеры
  </div>
  <div class="cat">
    <img src="https://images.unsplash.com/photo-1594007654729-407eedc4be65">
    Пицца
  </div>
  <div class="cat">
    <img src="https://images.unsplash.com/photo-1606755962773-0efc1c7f9f6f">
    Суши
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="chip active">Все</button>
  <button class="chip">Рядом</button>
  <button class="chip">Популярные</button>
  <button class="chip">Новые</button>
</div>

<!-- GRID -->
<div class="grid">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
    <div class="price-badge">490₽</div>
    <div class="star">⭐</div>
    <div class="card-content">
      <h3>Бургер Хаус</h3>
      <p>Средний чек · Улица</p>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">
    <div class="price-badge">490₽</div>
    <div class="star">⭐</div>
    <div class="card-content">
      <h3>Суши Лэнд</h3>
      <p>Средний чек · Центр</p>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div><span>🏠</span>Главная</div>
  <div><span>🔍</span>Поиск</div>
  <div><span>🗺</span>Карта</div>
  <div><span>❤️</span>Избранное</div>
  <div><span>👤</span>Профиль</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
</script>

</body>
</html>
