<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>City Places</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg,#07142c,#020817);
    color: white;
}

.container {
    padding: 16px;
    padding-bottom: 120px;
}

.ads {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.ads img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 16px;
}

.map-block {
    margin: 20px 0;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.search input {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    margin: 15px 0;
}

.categories {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
}

.cat {
    text-align: center;
}

.cat div {
    background: rgba(255,255,255,0.08);
    width: 70px;
    height: 70px;
    border-radius: 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:8px;
}

.filters {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.filter-btn {
    padding: 10px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    backdrop-filter: blur(20px);
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

.rating {
    position: absolute;
    top: 8px;
    left: 8px;
    background: black;
    padding: 4px 8px;
    border-radius: 10px;
    font-size: 12px;
}

.favorite {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 18px;
}

.card-content {
    padding: 10px;
}

.card-content h3 {
    margin: 4px 0;
    font-size: 16px;
}

.card-content p {
    margin: 2px 0;
    font-size: 12px;
    opacity: 0.8;
}

.bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-around;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 12px 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.nav-item {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    transition: 0.3s;
}

.nav-item div {
    font-size: 20px;
}

.nav-item.active {
    opacity: 1;
    color: #4da3ff;
}
</style>
</head>

<body>

<div class="container">

<div class="ads">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352">
<img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
</div>

<div class="map-block">MAP</div>

<div class="search">
<input type="text" placeholder="Поиск заведения..." id="searchInput">
</div>

<div class="categories">
<div class="cat"><div>🍸</div>Бар</div>
<div class="cat"><div>☕</div>Кафе</div>
<div class="cat"><div>🍽️</div>Ресторан</div>
<div class="cat"><div>🍔</div>Фастфуд</div>
</div>

<div class="filters">
<div class="filter-btn">Все</div>
<div class="filter-btn">Рядом</div>
<div class="filter-btn">Популярные</div>
</div>

<div class="cards" id="placesContainer"></div>

</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <div>🏠</div>
    <span>Главная</span>
  </div>

  <div class="nav-item">
    <div>🔎</div>
    <span>Поиск</span>
  </div>

  <div class="nav-item">
    <div>🗺</div>
    <span>Карта</span>
  </div>

  <div class="nav-item">
    <div>❤️</div>
    <span>Избранное</span>
  </div>

  <div class="nav-item">
    <div>👤</div>
    <span>Профиль</span>
  </div>
</div>

<script>
Telegram.WebApp.expand();

const API_URL = "https://city-places-app-production.up.railway.app/places";

fetch(API_URL)
.then(res => res.json())
.then(data => {
    const container = document.getElementById("placesContainer");
    container.innerHTML = "";

    data.forEach(place => {
    container.innerHTML += `
    <div class="card">
        <div class="rating">${place.rating || 0}°</div>

        <img src="${place.image || 'https://images.unsplash.com/photo-1550547660-d9450f859349'}">

        <div class="card-content">
            <h3>${place.name}</h3>
            <p>💰 ${place.average_price || "-" } ₽</p>
            <p>📍 ${place.street || "-"}</p>
            <p>🏷 ${place.type || "-"}</p>
            <p>⏰ ${place.work_time || "-"}</p>

            <button onclick="vote(${place.id}, 1)">⬆</button>
            <button onclick="vote(${place.id}, -1)">⬇</button>
            <button onclick="addFavorite(${place.id})">❤️</button>
        </div>
    </div>
    `;
});

function vote(id, value) {
    fetch(`/places/${id}/vote?value=` + value, {
        method: "POST"
    })
    .then(() => location.reload());
}

const telegramId = Telegram.WebApp.initDataUnsafe.user.id;

function vote(id, value) {
    fetch(`/places/${id}/vote?value=` + value, {
        method: "POST",
        headers: {
            "telegram-id": telegramId
        }
    }).then(() => location.reload());
}

function addFavorite(id) {
    fetch(`/places/${id}/favorite`, {
        method: "POST",
        headers: {
            "telegram-id": telegramId
        }
    }).then(() => alert("Добавлено в избранное"));
}
    
});
</script>

</body>
</html>
