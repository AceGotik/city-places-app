<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>City Places</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:linear-gradient(180deg,#0f172a,#020617);
  color:white;
  padding-bottom:120px;
}

/* ==== GLASS ==== */
.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
}

/* ==== ADS ==== */
.ads{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px;
}

.ad{
  min-width:160px;
  height:90px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.ad img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ==== FILTERS ==== */
.filters{
  display:flex;
  gap:10px;
  padding:16px;
  overflow-x:auto;
}

.chip{
  padding:8px 16px;
  border-radius:20px;
  border:none;
  background:rgba(255,255,255,0.1);
  color:white;
  transition:0.2s;
}

.chip.active{
  background:#2563eb;
}

/* ==== GRID ==== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:0 16px;
}

.card{
  overflow:hidden;
  position:relative;
  animation:fadeIn 0.4s ease;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,0.7);
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

.star{
  position:absolute;
  top:8px;
  right:8px;
  font-size:18px;
  cursor:pointer;
}

.card-content{
  padding:10px;
}

.card-content h3{
  font-size:16px;
}

.card-content p{
  font-size:12px;
  color:#9ca3af;
}

/* ==== BOTTOM NAV ==== */
.bottom-nav{
  position:fixed;
  bottom:20px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-around;
  padding:14px;
}

.bottom-nav div{
  text-align:center;
  font-size:12px;
}

.bottom-nav span{
  display:block;
  font-size:20px;
}

/* ==== ANIMATION ==== */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- ADS -->
<div class="ads">
  <div class="ad glass">
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
  </div>
  <div class="ad glass">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="chip active" onclick="setFilter('all')">Все</button>
  <button class="chip" onclick="getLocation()">Рядом</button>
  <button class="chip" onclick="setFilter('popular')">Популярные</button>
</div>

<!-- GRID -->
<div class="grid" id="placesGrid"></div>

<!-- NAV -->
<div class="bottom-nav glass">
  <div><span>🏠</span>Главная</div>
  <div><span>🔍</span>Поиск</div>
  <div><span>🗺</span>Карта</div>
  <div><span>❤️</span>Избранное</div>
  <div><span>👤</span>Профиль</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const API_URL = "https://city-places-app-production.up.railway.app";

let places = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

async function loadPlaces(){
  const res = await fetch(API_URL + "/places");
  places = await res.json();
  renderPlaces(places);
}

function renderPlaces(data){
  const grid = document.getElementById("placesGrid");
  grid.innerHTML = "";

  data.forEach(place=>{
    const isFav = favorites.includes(place.id);

    grid.innerHTML += `
      <div class="card glass">
        <img src="https://source.unsplash.com/400x300/?restaurant">
        <div class="badge">490₽</div>
        <div class="star" onclick="toggleFavorite(${place.id})">
          ${isFav ? "❤️" : "🤍"}
        </div>
        <div class="card-content">
          <h3>${place.name}</h3>
          <p>${place.category || ""}</p>
        </div>
      </div>
    `;
  });
}

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  }else{
    favorites.push(id);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));
  renderPlaces(places);
}

function setFilter(type){
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  event.target.classList.add("active");

  if(type==="all"){
    renderPlaces(places);
  }
}

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      tg.showAlert("Геолокация получена 📍");
    });
  }
}

loadPlaces();
</script>

</body>
</html>
