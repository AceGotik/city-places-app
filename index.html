<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<title>City Places</title>

<style>
body { margin:0; font-family:-apple-system; background:#07142c; color:white;}
.container{padding:16px;padding-bottom:120px;}
#map{height:300px;border-radius:20px;margin:20px 0;}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.card{background:rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;position:relative;}
.card img{width:100%;height:120px;object-fit:cover;}
.rating{position:absolute;top:8px;left:8px;background:black;padding:4px 8px;border-radius:10px;font-size:12px;}
.favorite{position:absolute;top:8px;right:8px;font-size:20px;cursor:pointer;transition:.2s;}
.favorite.active{color:red;transform:scale(1.2);}
.bottom-nav{position:fixed;bottom:20px;left:10px;right:10px;display:flex;justify-content:space-around;background:rgba(255,255,255,0.08);border-radius:30px;padding:12px;}
.nav-item{cursor:pointer;opacity:.6;}
.nav-item.active{opacity:1;color:#4da3ff;}
</style>
</head>

<body>

<div class="container">

<h2>Карта</h2>
<div id="map"></div>

<div class="cards" id="placesContainer"></div>

</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="showAll()">🏠</div>
<div class="nav-item" onclick="showFavorites()">❤️</div>
</div>

<script>

Telegram.WebApp.expand();

const API_BASE="https://city-places-app-production.up.railway.app";
const telegramId=Telegram.WebApp.initDataUnsafe.user.id;

let allPlaces=[];
let favorites=[];
let currentView="all";
let map;
let markers=[];

function initMap(){
    map=L.map('map').setView([55.7558,37.6173],12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);
}

function updateMarkers(){
    markers.forEach(m=>map.removeLayer(m));
    markers=[];

    let filtered=allPlaces;
    if(currentView==="favorites"){
        filtered=allPlaces.filter(p=>favorites.includes(p.id));
    }

    filtered.forEach(place=>{
        if(place.latitude && place.longitude){
            const marker=L.marker([place.latitude,place.longitude])
            .addTo(map)
            .bindPopup(`<b>${place.name}</b>`);
            markers.push(marker);
        }
    });
}

function loadFavorites(){
    return fetch(`${API_BASE}/favorites`,{
        headers:{"telegram-id":telegramId}
    })
    .then(res=>res.json())
    .then(data=>{
        favorites=data.map(p=>p.id);
    });
}

function loadPlaces(){
    fetch(`${API_BASE}/places`)
    .then(res=>res.json())
    .then(data=>{
        allPlaces=data;
        render();
        updateMarkers();
    });
}

function render(){
    const container=document.getElementById("placesContainer");
    container.innerHTML="";

    let filtered=allPlaces;
    if(currentView==="favorites"){
        filtered=allPlaces.filter(p=>favorites.includes(p.id));
    }

    filtered.forEach(place=>{
        const isFav=favorites.includes(place.id);

        container.innerHTML+=`
        <div class="card">
            <div class="rating">${place.rating||0}°</div>
            <div class="favorite ${isFav?'active':''}"
                onclick="toggleFavorite(${place.id},this)">❤️</div>
            <img src="${place.image||'https://images.unsplash.com/photo-1550547660-d9450f859349'}">
            <div style="padding:10px">
                <b>${place.name}</b>
                <p>💰 ${place.average_price||"-"} ₽</p>
                <button onclick="vote(${place.id},1)">⬆</button>
                <button onclick="vote(${place.id},-1)">⬇</button>
            </div>
        </div>
        `;
    });
}

function vote(id,value){
    fetch(`${API_BASE}/places/${id}/vote?value=`+value,{
        method:"POST",
        headers:{"telegram-id":telegramId}
    }).then(()=>loadPlaces());
}

function toggleFavorite(id,el){
    const isFav=favorites.includes(id);
    const method=isFav?"DELETE":"POST";

    fetch(`${API_BASE}/places/${id}/favorite`,{
        method:method,
        headers:{"telegram-id":telegramId}
    })
    .then(()=>loadFavorites().then(()=>{
        render();
        updateMarkers();
    }));
}

function showFavorites(){
    currentView="favorites";
    render();
    updateMarkers();
}

function showAll(){
    currentView="all";
    render();
    updateMarkers();
}

initMap();
loadFavorites().then(loadPlaces);

</script>

</body>
</html>
