<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>City Places</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(180deg,#07142c,#020817);
color:white;
overflow-x:hidden;
}
.container{
padding:16px;
padding-bottom:120px;
}

/* ADS */
.ads{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}
.ads img{
width:100%;
height:100px;
object-fit:cover;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
} 

/* MAP (Zenly-style) */
#map{
height:250px;
border-radius:26px;
margin-bottom:20px;
box-shadow:0 0 50px rgba(0,0,0,0.6);
filter: saturate(135%) contrast(110%) brightness(90%);
}
.leaflet-control-container{
display:none;
}

/* Zenly markers */
.zen-marker{
width:44px;
height:44px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:bold;
color:white;
box-shadow:0 0 25px rgba(0,0,0,0.3);
animation:markerPop 0.4s ease;
}
.zen-positive{background:linear-gradient(135deg,#00ff99,#00cc66);}
.zen-negative{background:linear-gradient(135deg,#ff4d4d,#ff0000);}
.zen-neutral{background:linear-gradient(135deg,#4da3ff,#1d9bf0);}
@keyframes markerPop{
0%{transform:scale(0);}
80%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* SEARCH */
.search input{
width:100%;
padding:14px;
border-radius:20px;
border:none;
font-size:15px;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
margin-bottom:20px;
}

/* CATEGORIES */
.categories{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}
.cat{text-align:center;font-size:12px;}
.cat div{
width:65px;height:65px;border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:26px;background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 0 20px rgba(0,0,0,0.4);
margin-bottom:6px;
}

/* FILTERS */
.filters{
display:flex;
gap:10px;
margin-bottom:20px;
overflow-x:auto;
}
.filter-btn{
padding:8px 14px;
border-radius:20px;
background:rgba(255,255,255,0.08);
font-size:13px;
white-space:nowrap;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
}
.card{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(25px);
border-radius:24px;
overflow:hidden;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,0.6);
animation:fadeUp 0.5s ease forwards;
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
.card img{
width:100%;
height:130px;
object-fit:cover;
}

/* RATING */
.rating{
position:absolute;
top:10px;
left:10px;
padding:6px 10px;
border-radius:12px;
font-size:12px;
font-weight:bold;
}
.rating.positive{background:linear-gradient(90deg,#00ff99,#00cc66);color:black;}
.rating.negative{background:linear-gradient(90deg,#ff4d4d,#ff0000);color:white;}
.rating.neutral{background:rgba(0,0,0,0.6);}

/* FAVORITE */
.favorite{
position:absolute;
top:10px;
right:10px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}
.favorite.active{
color:#ff4d6d;
animation:pop 0.3s ease;
}
@keyframes pop{
0%{transform:scale(1);}
50%{transform:scale(1.4);}
100%{transform:scale(1);}
}

/* CARD CONTENT */
.card-content{padding:10px;}
.vote-buttons{display:flex;gap:6px;margin-top:8px;}
.vote-btn{
flex:1;padding:6px;border-radius:10px;border:none;
background:rgba(255,255,255,0.1);color:white;cursor:pointer;
}
.vote-btn.active-up{background:#1d9bf0;box-shadow:0 0 15px #1d9bf0;}
.vote-btn.active-down{background:#ff4d4d;box-shadow:0 0 15px #ff4d4d;}

/* HEART FLOAT */
@keyframes floatHeart{
0%{transform:translateY(0) scale(1);opacity:1;}
100%{transform:translateY(-120px) scale(1.5);opacity:0;}
}
.floating-heart{
position:fixed;font-size:22px;
animation:floatHeart 1s ease forwards;
pointer-events:none;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:20px;left:10px;right:10px;
display:flex;justify-content:space-around;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
border-radius:30px;padding:12px 8px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}
.nav-item{text-align:center;font-size:11px;opacity:0.6;}
.nav-item.active{opacity:1;color:#4da3ff;}
</style>
</head>

<body>

<div class="container">

<div class="ads">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352">
<img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
</div>

<!-- Карта вставлена вместо map-block -->
<div id="map"></div>

<div class="search">
<input type="text" placeholder="Поиск заведения...">
</div>

<div class="categories">
<div class="cat"><div>🍸</div>Бар</div>
<div class="cat"><div>☕</div>Кафе</div>
<div class="cat"><div>🍽️</div>Ресторан</div>
<div class="cat"><div>🍔</div>Фастфуд</div>
</div>

<div class="filters">
<div class="filter-btn">Все</div>
<div class="filter-btn">Рядом</div>
<div class="filter-btn">Популярные</div>
</div>

<div class="cards" id="placesContainer"></div>

</div>

<div class="bottom-nav">
<div class="nav-item active">🏠<br>Главная</div>
<div class="nav-item">🗺<br>Карта</div>
<div class="nav-item">❤️<br>Избранное</div>
<div class="nav-item">👤<br>Профиль</div>
</div>

<script>
Telegram.WebApp.expand();

const API_BASE="https://city-places-app-production.up.railway.app";
const telegramId=Telegram.WebApp.initDataUnsafe?.user?.id;

let map;
let markersLayer;
let previewMap;
let fullMap;

// Превью карта (не двигается)
function initPreviewMap(){
  previewMap = L.map('map',{
    zoomControl:false,
    attributionControl:false,
    dragging:false,
    scrollWheelZoom:false,
    doubleClickZoom:false,
    boxZoom:false,
    keyboard:false,
    tap:false
  }).setView([53.9045,27.5615],12); // Минск

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
      subdomains:'abcd',
      maxZoom:20
    }
  ).addTo(previewMap);
}

function openFullMap(){
  document.getElementById("mapScreen").style.display = "flex";

  if(!fullMap){
    fullMap = L.map('fullMap',{
      zoomControl:true,
      attributionControl:false
    }).setView([53.9045,27.5615],13);

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {
        subdomains:'abcd',
        maxZoom:20
      }
    ).addTo(fullMap);
  }

  setTimeout(()=>{ fullMap.invalidateSize(); }, 200);
}

markersLayer=L.layerGroup().addTo(map);
}
};

function loadPlaces(){
fetch(API_BASE+"/places_with_vote",{headers:{"telegram-id":telegramId}})
.then(res=>res.json())
.then(data=>{
markersLayer.clearLayers();
const container=document.getElementById("placesContainer");
container.innerHTML="";

data.forEach(place=>{

if(place.latitude && place.longitude){
let markerClass="zen-neutral";
if(place.rating>0) markerClass="zen-positive";
if(place.rating<0) markerClass="zen-negative";

const icon=L.divIcon({
className:"",
html:`<div class="zen-marker ${markerClass}">
${place.rating||0}
</div>`,
iconSize:[44,44],
iconAnchor:[22,22]
});

L.marker([place.latitude,place.longitude],{icon:icon})
.addTo(markersLayer)
.bindPopup(`<b>${place.name}</b><br>💰 ${place.average_price||"-"} ₽`);
}

let ratingClass="neutral";
if(place.rating>0) ratingClass="positive";
if(place.rating<0) ratingClass="negative";

let upActive=place.user_vote===1?"active-up":"";
let downActive=place.user_vote===-1?"active-down":"";

container.innerHTML+=`
<div class="card">
<div class="rating ${ratingClass}">${place.rating||0}°</div>
<div class="favorite" onclick="toggleFavorite(${place.id},this)">❤️</div>
<img src="${place.image||'https://images.unsplash.com/photo-1550547660-d9450f859349'}">
<div class="card-content">
<h3>${place.name}</h3>
<p>💰 ${place.average_price||"-"} ₽</p>
<p>📍 ${place.street||"-"}</p>
<p>🏷 ${place.type||"-"}</p>
<p>⏰ ${place.work_time||"-"}</p>
<div class="vote-buttons">
<button class="vote-btn ${upActive}" onclick="vote(${place.id},1)">⬆</button>
<button class="vote-btn ${downActive}" onclick="vote(${place.id},-1)">⬇</button>
</div>
</div>
</div>
`;
});
});
}

function vote(id,value){
if(!telegramId){alert("Открой через Telegram");return;}
fetch(API_BASE+`/places/${id}/vote?value=`+value,{
method:"POST",
headers:{"telegram-id":telegramId}
}).then(()=>loadPlaces());
}

function toggleFavorite(id,el){
if(!telegramId){alert("Открой через Telegram");return;}
fetch(API_BASE+`/places/${id}/favorite`,{
method:"POST",
headers:{"telegram-id":telegramId}
}).then(()=>{
el.classList.toggle("active");
if(el.classList.contains("active")) createHearts();
});
}

function createHearts(){
for(let i=0;i<6;i++){
let heart=document.createElement("div");
heart.className="floating-heart";
heart.innerText="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=(window.innerHeight-100)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),1000);
}
}

initPreviewMap();          // запускаем превью карту
loadPlaces();              // загружаем заведения

document.getElementById("map").onclick = openFullMap;

document.getElementById("closeMapBtn").onclick = function(){
  document.getElementById("mapScreen").style.display = "none";
};
  
</script>

<div id="mapScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#07142c;
z-index:999;
display:none;
flex-direction:column;
">

<div style="padding:16px;font-weight:600;font-size:18px;">
← Назад
</div>

<div id="fullMap" style="flex:1;"></div>

</div>
  
</body>
</html>
