<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>City Places</title>

<style>
body{
  margin:0;
  font-family:-apple-system,sans-serif;
  background:linear-gradient(180deg,#0f172a,#020617);
  color:white;
  padding-bottom:120px;
}

/* === GLASS === */
.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
}

/* === ADS === */
.ads{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px;
}
.ad{
  min-width:180px;
  height:100px;
  border-radius:20px;
  overflow:hidden;
}
.ad img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* === MAP === */
.map{
  margin:0 16px 20px 16px;
  padding:30px;
  text-align:center;
  font-size:40px;
  font-weight:900;
}

/* === SEARCH + TYPES === */
.search-block{
  padding:0 16px;
}
.search{
  padding:12px;
  width:100%;
  border-radius:15px;
  border:none;
  margin-bottom:10px;
}
.types{
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.type-btn{
  padding:8px 14px;
  border-radius:20px;
  background:#1f2937;
  border:none;
  color:white;
}

/* === FILTERS === */
.filters{
  display:flex;
  gap:10px;
  padding:16px;
}
.chip{
  padding:8px 16px;
  border-radius:20px;
  border:none;
  background:#1f2937;
  color:white;
}
.chip.active{
  background:#2563eb;
}

/* === GRID === */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:0 16px;
}

.card{
  overflow:hidden;
  position:relative;
}
.card img{
  width:100%;
  height:130px;
  object-fit:cover;
}

/* rating like Pepper */
.rating{
  position:absolute;
  top:8px;
  left:8px;
  background:#111;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.rating span{
  color:#22c55e;
}

/* favorite */
.fav{
  position:absolute;
  top:8px;
  right:8px;
  font-size:18px;
  cursor:pointer;
}

.card-info{
  padding:10px;
}
.card-info h3{
  margin:4px 0;
}
.card-info p{
  margin:2px 0;
  font-size:12px;
  color:#9ca3af;
}

/* bottom nav */
.bottom-nav{
  position:fixed;
  bottom:20px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-around;
  padding:14px;
}
.bottom-nav div{
  text-align:center;
}
</style>
</head>
<body>

<!-- ADS -->
<div class="ads">
  <div class="ad glass"><img src="https://images.unsplash.com/photo-1550547660-d9450f859349"></div>
  <div class="ad glass"><img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"></div>
  <div class="ad glass"><img src="https://images.unsplash.com/photo-1606755962773-0efc1c7f9f6f"></div>
</div>

<!-- MAP -->
<div class="map glass">MAP</div>

<!-- SEARCH -->
<div class="search-block">
  <input class="search" placeholder="Поиск заведения...">
  <div class="types">
    <button class="type-btn">Бар</button>
    <button class="type-btn">Кафе</button>
    <button class="type-btn">Ресторан</button>
    <button class="type-btn">Фастфуд</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="chip active">Все</button>
  <button class="chip">Рядом</button>
  <button class="chip">Популярные</button>
  <button class="chip">Новые</button>
</div>

<!-- GRID -->
<div class="grid" id="places"></div>

<!-- NAV -->
<div class="bottom-nav glass">
  <div>🏠<br>Главная</div>
  <div>🔍<br>Поиск</div>
  <div>🗺<br>Карта</div>
  <div>❤️<br>Избранное</div>
  <div>👤<br>Профиль</div>
</div>

<script>
const API_URL="https://ТВОЙ-railway-url.up.railway.app";

async function load(){
  const res=await fetch(API_URL+"/places");
  const data=await res.json();
  const container=document.getElementById("places");
  container.innerHTML="";

  data.forEach(p=>{
    container.innerHTML+=`
      <div class="card glass">
        <img src="https://source.unsplash.com/400x300/?restaurant">
        <div class="rating"><span>⬆</span> ${p.rating}</div>
        <div class="fav">🤍</div>
        <div class="card-info">
          <h3>${p.name}</h3>
          <p>Средний чек: ${p.average_price}₽</p>
          <p>${p.street}</p>
          <p>${p.type}</p>
          <p>${p.work_time}</p>
        </div>
      </div>
    `;
  });
}
load();
</script>

</body>
</html>
