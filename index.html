<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>City Places</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(180deg,#07142c,#020817);
color:white;
overflow-x:hidden;
}
.container{
padding:16px;
padding-top:24px;
padding-bottom:140px;
}

.photo-gallery{
  display:flex;
  overflow-x:auto;
  gap:10px;
  margin-top:10px;
}

.photo-gallery img{
  width:250px;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  flex-shrink:0;
}

.detail-gallery{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:12px;
}

.detail-gallery img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:18px;
  scroll-snap-align:center;
  flex-shrink:0;
  cursor:pointer;
}

.menu-gallery{
  display:flex;
  overflow-x:auto;
  gap:12px;
  margin-top:10px;
}

.menu-gallery img{
  height:180px;
  border-radius:14px;
  object-fit:cover;
  cursor:pointer;
}

.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.96);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
  animation:fadeIn 0.25s ease;
}

.lightbox img{
  max-width:95%;
  max-height:80%;
  border-radius:16px;
  transition:transform 0.3s ease;
}

.lightbox-close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:26px;
  color:white;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  padding:6px 12px;
  border-radius:12px;
}

.lightbox-indicator{
  margin-top:15px;
  color:white;
  font-size:14px;
  opacity:0.8;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
  
/* ADS */
.ads{
display:flex;
gap:14px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:10px;
margin-bottom:20px;
}

.ads::-webkit-scrollbar{
display:none;
}

.ads a{
flex:0 0 42%;   /* ← видно 2 полностью + кусочек 3 */
scroll-snap-align:center;
}

.ads img{
width:100%;
height:130px;
object-fit:cover;
border-radius:22px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
transition:transform .3s ease;
}

.ads img:active{
transform:scale(.97);
}

/* PREVIEW MAP */
#map{
height:260px;
border-radius:26px;
margin-bottom:20px;
box-shadow:0 0 50px rgba(0,0,0,0.6);
filter:saturate(130%) contrast(110%) brightness(92%);
cursor:pointer;
}
.leaflet-control-container{display:none;}

/* FULL MAP TAB */
#mapTab{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#07142c;
z-index:1;
}

.bottom-nav{
z-index:1000;
}

#fullMapTab{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

/* SEARCH */
.search{
margin-top:8px;
margin-bottom:8px;
}

.search input{
width:100%;
padding:16px 18px;
border-radius:26px;
border:none;
font-size:15px;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
box-sizing:border-box;
}

/* CATEGORIES */
.categories{
display:flex;justify-content:space-between;
margin-bottom:20px;
}
.cat{text-align:center;font-size:12px;}
.cat div{
width:65px;height:65px;border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:26px;background:rgba(255,255,255,0.08);
box-shadow:0 0 20px rgba(0,0,0,0.4);
margin-bottom:6px;
}
.cat.active div{
  background:rgba(255,255,255,0.08);   /* обычный фон */
  border:2px solid #4da3ff;
  box-shadow:0 0 4px rgba(77,163,255,0.4);  /* минимальное свечение */
}

/* FILTERS */
.filters{
display:flex;
gap:12px;
margin-bottom:22px;
overflow-x:auto;
overflow-y:visible;
padding:14px 10px;   /* больше воздуха */
position:relative;
}

.filter-btn{
position:relative;
padding:8px 14px;
border-radius:20px;
background:rgba(255,255,255,0.08);
font-size:13px;
white-space:nowrap;
opacity:.6;
transition:.2s ease;

border:2px solid transparent;   /* 👈 ВАЖНО */
box-sizing:border-box;          /* 👈 ВАЖНО */
}

.filter-btn.active{
  opacity:1;
  background:rgba(255,255,255,0.08);
  border:2px solid #4da3ff;
  box-shadow:0 0 4px rgba(77,163,255,0.4); /* минимально */
}
  


/* CARDS */
.cards{
display:grid;grid-template-columns:repeat(2,1fr);
gap:16px;
}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  backdrop-filter:blur(30px);
  border-radius:26px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);

  opacity:0;
  transform:translateY(15px) scale(0.97);
  transition: transform .35s cubic-bezier(.2,.8,.2,1), 
              opacity .25s ease;
}

.card.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

.card:active{
transform:scale(.97);
}
  
@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
.card img{
width:100%;
height:150px;
object-fit:cover;
filter:saturate(115%) contrast(105%);
}

.img-wrapper{
position:relative;
width:100%;
height:150px;
overflow:hidden;
}

.img-wrapper img{
width:100%;
height:150px;
object-fit:cover;
filter:saturate(115%) contrast(105%);
}

.img-gradient{
position:absolute;
bottom:0;
left:0;
width:100%;
height:60%;
background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
pointer-events:none;
}

.rating{
position:absolute;
top:10px;
left:10px;
padding:6px 10px;
border-radius:12px;
font-size:12px;
font-weight:bold;
z-index:10;
}
.rating.positive{background:#00cc66;color:black;}
.rating.negative{background:#ff0000;}
.rating.neutral{background:rgba(0,0,0,0.6);}

/* FAVORITE */
.favorite{
position:absolute;
top:10px;
right:10px;
font-size:20px;
cursor:pointer;
opacity:.4;
transition:.3s;
z-index:10;
}
.favorite.active{
opacity:1;
color:#ff2d55;
transform:scale(1.2);
filter:drop-shadow(0 0 6px rgba(255,45,85,.8));
}

/* FLOAT HEARTS */
@keyframes floatHeart{
0%{transform:translateY(0) scale(1);opacity:1;}
100%{transform:translateY(-120px) scale(1.5);opacity:0;}
}
.floating-heart{
position:fixed;font-size:22px;
animation:floatHeart 1s ease forwards;
pointer-events:none;
}

/* VOTE */
.vote-buttons{display:flex;gap:6px;margin-top:8px;}
.vote-btn{
flex:1;padding:6px;border-radius:10px;
border:none;background:rgba(255,255,255,0.1);
color:white;cursor:pointer;transition:.2s;
}
.vote-btn.active-up{background:#1d9bf0;box-shadow:0 0 15px #1d9bf0;}
.vote-btn.active-down{background:#ff4d4d;box-shadow:0 0 15px #ff4d4d;}

/* NAV */
.bottom-nav{
position:fixed;
bottom:20px;
left:10px;
right:10px;
display:flex;
justify-content:space-around;

background:rgba(15,25,45,0.75);   /* фиксированный цвет */
backdrop-filter:blur(25px);

border-radius:30px;
padding:12px 8px;

box-shadow:0 0 30px rgba(0,0,0,0.6);

z-index:10000;   /* ВАЖНО */
}

#mapTab{
z-index:1;
}

#fullMapTab{
z-index:1;
}
  
.nav-item{text-align:center;font-size:11px;opacity:.6;}
.nav-item.active{opacity:1;color:#4da3ff;}
.screen{
display:none;
}

.screen.active{
display:block;
}

/* MARKERS */
.zen-marker{
width:44px;height:44px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:13px;font-weight:bold;color:white;
box-shadow:0 0 25px rgba(0,0,0,0.3);
}
.zen-positive{background:linear-gradient(135deg,#00ff99,#00cc66);}
.zen-negative{background:linear-gradient(135deg,#ff4d4d,#ff0000);}
.zen-neutral{background:linear-gradient(135deg,#4da3ff,#1d9bf0);}
</style>
</head>

<body>

<div class="container">
  
<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="homeScreen" class="screen active">

<div class="ads" id="adsContainer"></div>

<div id="map"></div>

<div class="search">
<input type="text" id="searchInput" placeholder="Поиск заведения...">
</div>

<div class="categories">
  <div class="cat" data-type="1"><div>🍸</div>Бар</div>
  <div class="cat" data-type="2"><div>☕</div>Кафе</div>
  <div class="cat" data-type="3"><div>🍽️</div>Ресторан</div>
  <div class="cat" data-type="4"><div>🍔</div>Фастфуд</div>
</div>

<div class="filters">
<div class="filter-btn" data-filter="near">Рядом</div>
<div class="filter-btn" data-filter="popular">Популярные</div>
<div class="filter-btn" data-filter="new" id="newFilter">Новое</div>
</div>

<div class="cards" id="placesContainer"></div>

</div>

  <div id="lightbox" class="lightbox">

  <div class="lightbox-close" onclick="closeLightbox()">✕</div>

  <img id="lightboxImg">

  <div class="lightbox-indicator" id="lightboxIndicator"></div>

</div>
<!-- КОНЕЦ ГЛАВНОГО -->

<div id="profileTab" class="screen">
  <div style="padding:20px">

    <div style="text-align:center;margin-bottom:20px;">
      <img id="profileAvatar"
           style="width:110px;
                  height:110px;
                  border-radius:50%;
                  object-fit:cover;
                  box-shadow:0 0 25px rgba(0,0,0,0.6);">

      <h2 id="profileName" style="margin-top:12px;"></h2>
      <p id="profileUsername" style="opacity:.6;margin-top:-8px;"></p>
    </div>

    <div id="profileContent"></div>

  </div>
</div>

<div id="placeDetailTab" class="screen">
  <div id="placeDetailContent"></div>
</div>
  
<!-- ВКЛАДКА КАРТЫ -->
<div id="mapTab" class="screen">
<div id="fullMapTab" style="height:100vh;"></div>
</div>

<div id="favoritesTab" class="screen">
  <div style="padding:16px;">
    <h2>❤️ Избранное</h2>
    <div class="cards" id="favoritesContainer"></div>
  </div>
</div>

</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="switchTab('home')">🏠<br>Главная</div>
<div class="nav-item" onclick="switchTab('map')">🗺<br>Карта</div>
<div class="nav-item" onclick="switchTab('favorites')">❤️<br>Избранное</div>
<div class="nav-item" onclick="switchTab('profile')">👤<br>Профиль</div>
</div>
  <script>
Telegram.WebApp.expand();
Telegram.WebApp.ready();

const API_BASE = "https://city-places-app-production.up.railway.app";
const telegramId = Telegram.WebApp.initDataUnsafe?.user?.id;

let previewMap, previewMarkers;
let fullMapTab, fullMapMarkers;

let allPlaces = [];
let activeCategory = "all";
let activeFilter = "all";
let searchQuery = "";
let userLocation = null;
let searchTimeout;

let currentGallery = [];
let currentIndex = 0;
let selectedRecommendation = "neutral";


// ======================
// УТИЛИТЫ
// ======================

function buildImgUrl(src){
  if(!src) return "";
  if(src.startsWith("http")) return src;
  if(src.startsWith("/")) return API_BASE + src;
  return API_BASE + "/" + src;
}

function isNew(createdAt){
  const now = new Date();
  const created = new Date(createdAt);
  const diff = (now - created) / (1000*60*60*24);
  return diff <= 14;
}

function getDistance(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}


// ======================
// ГЕОЛОКАЦИЯ
// ======================

function getUserLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLocation = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };
    });
  }
}
    // ======================
// PREVIEW MAP
// ======================

function initPreviewMap(){

  previewMap = L.map('map',{
    zoomControl:false,
    attributionControl:false
  }).setView([53.9045,27.5615],12);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { subdomains:'abcd', maxZoom:20 }
  ).addTo(previewMap);

  previewMap.dragging.disable();
  previewMap.scrollWheelZoom.disable();
  previewMap.doubleClickZoom.disable();
  previewMap.touchZoom.disable();
  previewMap.boxZoom.disable();
  previewMap.keyboard.disable();

  previewMarkers = L.layerGroup().addTo(previewMap);
}

document.getElementById("map").onclick = () => {
  switchTab('map');
};


// ======================
// FULL MAP
// ======================

function initFullMap(){

  fullMapTab = L.map('fullMapTab',{
    zoomControl:true,
    attributionControl:false
  }).setView([53.9045,27.5615],13);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { subdomains:'abcd', maxZoom:20 }
  ).addTo(fullMapTab);

  fullMapMarkers = L.layerGroup().addTo(fullMapTab);
}

function loadFullMapMarkers(){

  if(!fullMapMarkers) return;

  fullMapMarkers.clearLayers();

  allPlaces.forEach(place=>{
    if(place.latitude && place.longitude){
      L.marker([
        parseFloat(place.latitude),
        parseFloat(place.longitude)
      ]).addTo(fullMapMarkers);
    }
  });
}
    // ======================
// ЗАГРУЗКА МЕСТ
// ======================

async function loadPlaces(){
  try {

    const [placesRes, voteRes] = await Promise.all([
      fetch(API_BASE + "/places"),
      fetch(API_BASE + "/places_with_vote", {
        headers: { "telegram-id": telegramId }
      })
    ]);

    const places = await placesRes.json();
    const votes = await voteRes.json();

    const votesMap = new Map();
    votes.forEach(v => votesMap.set(v.id, v));

    allPlaces = places.map(p => {
      const v = votesMap.get(p.id) || {};
      return {
        ...p,
        user_vote: v.user_vote ?? 0,
        is_favorite: v.is_favorite ?? false,
        is_visited: v.is_visited ?? false,
        rating: v.rating ?? p.rating ?? 0,
        photos: Array.isArray(p.photos) ? p.photos : [],
        menu: Array.isArray(p.menu) ? p.menu : []
      };
    });

    renderPlaces();

  } catch (err) {
    console.error("loadPlaces error:", err);
  }
}
    // ======================
// РЕНДЕР КАРТОЧЕК
// ======================

function renderPlaces(){

  let data = [...allPlaces];
  const container = document.getElementById("placesContainer");
  container.innerHTML = "";

  const newBtn = document.getElementById("newFilter");

  let newPlaces = allPlaces.filter(p => p.created_at && isNew(p.created_at));

  if(newPlaces.length > 0 && activeFilter !== "new"){
    newBtn.classList.add("new-glow");
  }else{
    newBtn.classList.remove("new-glow");
  }

  // ФИЛЬТР КАТЕГОРИИ
  if(activeCategory !== "all"){
    data = data.filter(p => parseInt(p.type) === activeCategory);
  }

  // ФИЛЬТР НОВОЕ
  if(activeFilter === "new"){
    data = data.filter(p => p.created_at && isNew(p.created_at));
  }

  // ФИЛЬТР РЯДОМ
  if(activeFilter === "near" && userLocation){
    data = data.filter(p => {
      if(!p.latitude || !p.longitude) return false;

      const distance = getDistance(
        userLocation.lat,
        userLocation.lng,
        p.latitude,
        p.longitude
      );

      p.distance = distance;
      return distance <= 3;
    });

    data.sort((a,b)=>a.distance-b.distance);
  }

  // ПОПУЛЯРНЫЕ
  if(activeFilter === "popular"){
    data = data.sort((a,b)=> (b.rating||0) - (a.rating||0));
  }

  // ПОИСК
  if(searchQuery){
    data = data.filter(p =>
      p.name && p.name.toLowerCase().includes(searchQuery)
    );
  }

  // ЧИСТИМ ПРЕВЬЮ КАРТУ
  if(previewMarkers){
    previewMarkers.clearLayers();
  }

  data.forEach(place=>{

    const typeNames = {
      1: "Бар",
      2: "Кафе",
      3: "Ресторан",
      4: "Фастфуд"
    };

    const typeText = typeNames[place.type] || "-";

    let ratingClass="neutral";
    if(place.rating>0) ratingClass="positive";
    if(place.rating<0) ratingClass="negative";

    let upActive=place.user_vote===1?"active-up":"";
    let downActive=place.user_vote===-1?"active-down":"";
    let favActive=place.is_favorite?"active":"";

    // МАРКЕР НА ПРЕВЬЮ КАРТЕ
    if(place.latitude && place.longitude){

      const icon = L.divIcon({
        className:"",
        html:`
        <div style="
          width:44px;
          height:44px;
          border-radius:50%;
          background:linear-gradient(135deg,#1d9bf0,#4da3ff);
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:20px;
          box-shadow:0 0 20px rgba(0,0,0,0.4);
        ">
        📍
        </div>
        `,
        iconSize:[44,44],
        iconAnchor:[22,22]
      });

      L.marker([
        parseFloat(place.latitude),
        parseFloat(place.longitude)
      ],{icon}).addTo(previewMarkers);
    }

    // ОБЛОЖКА (ПЕРВОЕ ФОТО)
    let coverImage = null;

    if(place.photos?.length){
      coverImage = buildImgUrl(place.photos[0].image);
    }
    else if(place.image){
      coverImage = buildImgUrl(place.image);
    }

    container.innerHTML+=`
    <div class="card" onclick="openPlace(${place.id})">

      <div class="rating ${ratingClass}">${place.rating||0}°</div>

      <div class="favorite ${favActive}"
           onclick="event.stopPropagation(); toggleFavorite(${place.id},this)">
        ❤️
      </div>

      <div class="img-wrapper">
        ${
          coverImage
          ? `<img src="${coverImage}" loading="lazy">`
          : `<div style="height:150px;background:#111"></div>`
        }
        <div class="img-gradient"></div>
      </div>

      <div class="card-content">
        <h3>${place.name}</h3>
        <p>💰 ${place.average_price||"-"} ₽</p>
        <p>📍 ${place.street||"-"}</p>
        <p>🏷 ${typeText}</p>
        <p>⏰ ${place.work_time||"-"}</p>

        <div class="vote-buttons">
          <button class="vote-btn ${upActive}"
                  onclick="event.stopPropagation(); vote(${place.id},1)">⬆</button>
          <button class="vote-btn ${downActive}"
                  onclick="event.stopPropagation(); vote(${place.id},-1)">⬇</button>
        </div>

      </div>
    </div>`;
  });

  setTimeout(()=>{
    document.querySelectorAll(".card").forEach((card, index)=>{
      setTimeout(()=>{
        card.classList.add("show");
      }, index * 50);
    });
  },10);
}
    // ======================
// ДЕТАЛЬНАЯ СТРАНИЦА
// ======================

function openPlace(id){

  const place = allPlaces.find(p => p.id === id);
  if(!place) return;

  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  document.getElementById("placeDetailTab").classList.add("active");

  const typeNames = {
    1: "Бар",
    2: "Кафе",
    3: "Ресторан",
    4: "Фастфуд"
  };

  const typeText = typeNames[place.type] || "-";

  // =====================
  // ГАЛЕРЕЯ ЗАВЕДЕНИЯ
  // =====================

  const photos = place.photos?.length
    ? place.photos
    : (place.image ? [{image: place.image}] : []);

  const galleryHtml = `
  <div class="detail-gallery">
    ${photos.map((ph,index)=>`
      <img src="${buildImgUrl(ph.image)}"
           loading="lazy"
           onclick="openLightbox(${index},${place.id})">
    `).join("")}
  </div>`;

  // =====================
  // МЕНЮ
  // =====================

  let menuHtml = "";

  if(place.menu?.length){
    menuHtml = `
      <div class="menu-gallery">
        ${place.menu.map((m,index)=>`
          <img src="${buildImgUrl(m.image)}"
               loading="lazy"
               onclick="openMenuLightbox(${index},${place.id})">
        `).join("")}
      </div>
    `;
  }else{
    menuHtml = `<p style="opacity:.6;">Пока нет фото меню</p>`;
  }

  // =====================
  // HTML
  // =====================

  document.getElementById("placeDetailContent").innerHTML = `
  <div>

    <div style="position:relative;">
      ${galleryHtml}

      <div style="
        position:absolute;

  // КАРТА ВНУТРИ КАРТОЧКИ
  if(place.latitude && place.longitude){

        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',

        parseFloat(place.longitude)
      ]).addTo(map);

  loadReviews(id);

// LIGHTBOX
// ======================

function openLightbox(index, placeId){

  const place = allPlaces.find(p=>p.id===placeId);

  currentGallery = place.photos?.length
    ? place.photos.map(p=>p.image)
    : [place.image];

  currentIndex = index;

  showLightboxImage();
  document.getElementById("lightbox").style.display="flex";
}

function openMenuLightbox(index, placeId){

  const place = allPlaces.find(p=>p.id===placeId);

  currentGallery = place.menu.map(m=>m.image);
  currentIndex = index;

  showLightboxImage();
  document.getElementById("lightbox").style.display="flex";
}

function showLightboxImage(){

  const img = document.getElementById("lightboxImg");
  img.src = buildImgUrl(currentGallery[currentIndex]);

  document.getElementById("lightboxIndicator").innerText =
    `${currentIndex+1} / ${currentGallery.length}`;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

document.getElementById("lightbox").addEventListener("click", function(e){
  if(e.target.id === "lightbox"){
    closeLightbox();
  }
});

let startX = 0;

document.getElementById("lightboxImg").addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.getElementById("lightboxImg").addEventListener("touchend", e=>{
  let diff = e.changedTouches[0].clientX - startX;

  if(Math.abs(diff) > 50){
    if(diff < 0){
      nextImage();
    } else {
      prevImage();
    }
  }
});

function nextImage(){
  if(currentIndex < currentGallery.length - 1){
    currentIndex++;
    showLightboxImage();
  }
}

function prevImage(){
  if(currentIndex > 0){
    currentIndex--;
    showLightboxImage();
  }
}
    // ======================
// ОТЗЫВЫ
// ======================

function selectRecommendation(type){

  selectedRecommendation = type;

  document.querySelectorAll(".rec-btn").forEach(btn=>{
    btn.style.background = "rgba(255,255,255,0.1)";
  });

  if(type === "positive"){
    document.getElementById("rec-positive").style.background = "#00cc66";
  }
  if(type === "neutral"){
    document.getElementById("rec-neutral").style.background = "#666";
  }
  if(type === "negative"){
    document.getElementById("rec-negative").style.background = "#ff4d4d";
  }
}

function submitReview(placeId){

  const text = document.getElementById("reviewText").value;
  if(!text) return alert("Напишите отзыв");

  const user = Telegram.WebApp.initDataUnsafe.user;

  fetch(API_BASE + `/places/${placeId}/review?recommendation=${selectedRecommendation}&text=${encodeURIComponent(text)}&username=${encodeURIComponent(user.first_name)}`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(()=>{

    document.getElementById("reviewText").value="";
    loadReviews(placeId);

  });
}

function loadReviews(placeId){

  fetch(API_BASE + `/places/${placeId}/reviews`,{
    headers:{ "telegram-id":telegramId }
  })
  .then(res=>res.json())
  .then(data=>{

    const container = document.getElementById("reviewsContainer");
    container.innerHTML="";

    if(!data.length){
      container.innerHTML="<p style='opacity:.6;'>Пока нет отзывов</p>";
      return;
    }

    data.forEach(review=>{

      let bg="rgba(255,255,255,0.05)";
      if(review.recommendation==="positive") bg="rgba(0,204,102,0.2)";
      if(review.recommendation==="negative") bg="rgba(255,77,77,0.2)";

      container.innerHTML+=`
      <div style="background:${bg};padding:12px;border-radius:14px;margin-bottom:10px;">

        <div style="font-weight:bold;margin-bottom:6px;">
          ${review.username || "Пользователь"}
        </div>

        <div>${review.text}</div>

        <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">

          <div style="cursor:pointer;"
               onclick="toggleReviewLike(${review.id},${placeId})">
            ${review.user_liked ? "👍" : "👍🏻"} ${review.likes}
          </div>

          ${review.is_mine ? `
            <div style="font-size:13px;color:#ff4d4d;cursor:pointer;"
                 onclick="deleteReview(${review.id},${placeId})">
              🗑 Удалить
            </div>` : ""}

        </div>

      </div>`;
    });
  });
}

function deleteReview(reviewId, placeId){

  fetch(API_BASE + `/reviews/${reviewId}`,{
    method:"DELETE",
    headers:{ "telegram-id":telegramId }
  })
  .then(()=>loadReviews(placeId));
}

function toggleReviewLike(reviewId, placeId){

  fetch(API_BASE + `/reviews/${reviewId}/like`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(()=>loadReviews(placeId));
}

function vote(id, value){

  fetch(API_BASE + `/places/${id}/vote?value=${value}`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(()=>loadPlaces());

// ======================
// ИЗБРАННОЕ
// ======================

function toggleFavorite(id, el){

  fetch(API_BASE + `/places/${id}/favorite`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(res=>res.json())
  .then(data=>{

    if(data.message==="Added"){
      el.classList.add("active");
    }else{
      el.classList.remove("active");
    }
  });
}

function toggleDetailFavorite(id){

  fetch(API_BASE + `/places/${id}/favorite`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(res=>res.json())
  .then(data=>{

    const btn=document.getElementById("detailFavBtn");

    if(data.message==="Added"){
      btn.innerText="❤️ В избранном";
      btn.style.background="#00cc66";
    }else{
      btn.innerText="❤️ В избранное";
      btn.style.background="#ff2d55";
    }
  });
}

function toggleVisit(id){

  fetch(API_BASE + `/places/${id}/visit`,{
    method:"POST",
    headers:{ "telegram-id":telegramId }
  })
  .then(()=>loadPlaces());
}

function loadProfile(){

  const user = Telegram.WebApp.initDataUnsafe?.user;
  if(!user) return;

  document.getElementById("profileName").innerText =
    user.first_name + (user.last_name ? " "+user.last_name : "");

  document.getElementById("profileUsername").innerText =
    user.username ? "@"+user.username : "";

  document.getElementById("profileAvatar").src =
    user.photo_url || "https://via.placeholder.com/110";

  document.getElementById("profileContent").innerHTML =
    "<p style='opacity:.6;text-align:center;'>Профиль пользователя</p>";
}

function loadFavorites(){

  fetch(API_BASE + "/favorites",{
    headers:{ "telegram-id":telegramId }
  })
  .then(res=>res.json())
  .then(data=>{

    const container=document.getElementById("favoritesContainer");
    container.innerHTML="";

    if(!data.length){
      container.innerHTML="<p style='opacity:.6'>Пока ничего нет</p>";
      return;
    }

    data.forEach(place=>{

      let cover = place.photos?.length
        ? buildImgUrl(place.photos[0].image)
        : buildImgUrl(place.image);

      container.innerHTML+=`
      <div class="card show" onclick="openPlace(${place.id})">

        <div class="img-wrapper">
          <img src="${cover || ''}">
          <div class="img-gradient"></div>
        </div>

        <div class="card-content">
          <h3>${place.name}</h3>
          <p>💰 ${place.average_price||"-"} ₽</p>
        </div>

      </div>`;
    });
  });
}

// НАВИГАЦИЯ
// ======================

function switchTab(tab){

  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  document.querySelectorAll(".nav-item")
    .forEach(n=>n.classList.remove("active"));

  if(tab==="home"){
    document.getElementById("homeScreen").classList.add("active");
    document.querySelectorAll(".nav-item")[0].classList.add("active");
  }

  if(tab==="map"){
    document.getElementById("mapTab").classList.add("active");
    document.querySelectorAll(".nav-item")[1].classList.add("active");

    if(!fullMapTab){
      initFullMap();
    }

    setTimeout(()=>fullMapTab.invalidateSize(),200);
    loadFullMapMarkers();
  }

  if(tab==="favorites"){
    document.getElementById("favoritesTab").classList.add("active");
    document.querySelectorAll(".nav-item")[2].classList.add("active");
    loadFavorites();
  }

  if(tab==="profile"){
    document.getElementById("profileTab").classList.add("active");
    document.querySelectorAll(".nav-item")[3].classList.add("active");
    loadProfile();
  }
}

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.onclick=function(){

    const selected=this.dataset.filter;

    if(activeFilter===selected){
      activeFilter="all";
      document.querySelectorAll(".filter-btn")
        .forEach(b=>b.classList.remove("active"));
      renderPlaces();
      return;
    }

    document.querySelectorAll(".filter-btn")
      .forEach(b=>b.classList.remove("active"));

    this.classList.add("active");
    activeFilter=selected;

    renderPlaces();
  }
});

document.querySelectorAll(".cat").forEach(cat=>{
  cat.onclick=function(){

    const selected=parseInt(this.dataset.type);

    if(activeCategory===selected){
      activeCategory="all";
      document.querySelectorAll(".cat")
        .forEach(c=>c.classList.remove("active"));
      renderPlaces();
      return;
    }

    document.querySelectorAll(".cat")
      .forEach(c=>c.classList.remove("active"));

    this.classList.add("active");
    activeCategory=selected;

    renderPlaces();
  }
});

document.getElementById("searchInput")
.addEventListener("input",function(){

  clearTimeout(searchTimeout);

  searchTimeout=setTimeout(()=>{
    searchQuery=this.value.toLowerCase();
    renderPlaces();
  },200);
});

function loadBanners(){
