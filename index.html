<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>City Places</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: linear-gradient(180deg, #0f172a, #020617);
  color: white;
  padding: 16px;
  padding-bottom: 100px;
}

/* === Glass Effect === */
.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* === Header === */
h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* === Filters === */
.filters {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 20px;
}

.chip {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

.chip.active {
  background: #2563eb;
}

/* === Cards === */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.card {
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

/* === Bottom Nav === */
.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-around;
  padding: 14px;
}

.nav-btn {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
}
</style>
</head>

<body>

<h1>Главное меню</h1>

<div class="filters">
  <button class="chip active">Все</button>
  <button class="chip">Рядом</button>
  <button class="chip">Популярные</button>
  <button class="chip">Новые</button>
</div>

<div class="grid">

  <div class="card glass">
    <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
    <div class="card-content">
      <h3>Бургер Хаус</h3>
      <p>Средний чек 490₽</p>
    </div>
  </div>

  <div class="card glass">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">
    <div class="card-content">
      <h3>Суши Лэнд</h3>
      <p>Средний чек 650₽</p>
    </div>
  </div>

</div>

<div class="bottom-nav glass">
  <button class="nav-btn">🏠</button>
  <button class="nav-btn">🔍</button>
  <button class="nav-btn">🗺</button>
  <button class="nav-btn">❤️</button>
  <button class="nav-btn">👤</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
</script>

</body>
</html>
