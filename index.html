<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>City Places</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(180deg,#07142c,#020817);
color:white;
overflow-x:hidden;
}

.container{
padding:16px;
padding-top:24px;
padding-bottom:140px;
}

/* ADS */
.ads{
display:flex;
gap:14px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:10px;
margin-bottom:20px;
}
.ads::-webkit-scrollbar{display:none;}
.ads a{flex:0 0 42%;scroll-snap-align:center;}
.ads img{
width:100%;
height:130px;
object-fit:cover;
border-radius:22px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
transition:transform .3s ease;
}
.ads img:active{transform:scale(.97);}

/* MAP */
#map{
height:260px;
border-radius:26px;
margin-bottom:20px;
box-shadow:0 0 50px rgba(0,0,0,0.6);
filter:saturate(130%) contrast(110%) brightness(92%);
cursor:pointer;
}
.leaflet-control-container{display:none;}

#mapScreen{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#07142c;z-index:999;display:none;
flex-direction:column;
}
#fullMap{flex:1;}
#closeMapBtn{
padding:16px;font-weight:600;font-size:18px;
cursor:pointer;
}

/* SEARCH */
.search input{
width:100%;
padding:14px;
border-radius:20px;
border:none;
font-size:15px;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
margin-bottom:20px;
}

/* FILTERS */
.filters{
display:flex;
gap:12px;
margin-bottom:22px;
overflow-x:auto;
overflow-y:visible;
padding:8px 6px;
}

.filter-btn{
padding:8px 14px;
border-radius:20px;
background:rgba(255,255,255,0.08);
font-size:13px;
white-space:nowrap;
opacity:.6;
transition:.2s ease;
}

.filter-btn.active{
opacity:1;
background:rgba(255,255,255,0.15);
}

.new-glow{
border-radius:20px;
box-shadow:
0 0 0 1px #00ff88,
0 0 14px rgba(0,255,136,.9),
0 0 24px rgba(0,255,136,.5);
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
}

.card{
background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
backdrop-filter:blur(30px);
border-radius:26px;
overflow:hidden;
position:relative;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
transition:.25s ease;
}
.card:active{transform:scale(.97);}

.img-wrapper{
position:relative;
width:100%;
height:150px;
overflow:hidden;
}
.img-wrapper img{
width:100%;
height:150px;
object-fit:cover;
filter:saturate(115%) contrast(105%);
}
.img-gradient{
position:absolute;
bottom:0;
left:0;
width:100%;
height:60%;
background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
pointer-events:none;
}

.rating{
position:absolute;
top:10px;
left:10px;
padding:6px 10px;
border-radius:12px;
font-size:12px;
font-weight:bold;
}
.rating.positive{background:#00cc66;color:black;}
.rating.negative{background:#ff0000;}
.rating.neutral{background:rgba(0,0,0,0.6);}

.favorite{
position:absolute;
top:10px;
right:10px;
font-size:20px;
cursor:pointer;
opacity:.4;
transition:.3s;
}
.favorite.active{
opacity:1;
color:#ff2d55;
transform:scale(1.2);
}

.vote-buttons{
display:flex;
gap:6px;
margin-top:8px;
}
.vote-btn{
flex:1;
padding:6px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.1);
color:white;
cursor:pointer;
transition:.2s;
}
.vote-btn.active-up{background:#1d9bf0;box-shadow:0 0 15px #1d9bf0;}
.vote-btn.active-down{background:#ff4d4d;box-shadow:0 0 15px #ff4d4d;}

/* NAV */
.bottom-nav{
position:fixed;bottom:20px;left:10px;right:10px;
display:flex;justify-content:space-around;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
border-radius:30px;padding:12px 8px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}
.nav-item{text-align:center;font-size:11px;opacity:.6;}
.nav-item.active{opacity:1;color:#4da3ff;}
</style>
</head>

<body>

<div class="container">
<div class="ads" id="adsContainer"></div>
<div id="map"></div>

<div class="search">
<input type="text" placeholder="Поиск заведения...">
</div>

<div class="filters">
<div class="filter-btn active" data-filter="all">Все</div>
<div class="filter-btn" data-filter="near">Рядом</div>
<div class="filter-btn" data-filter="popular">Популярные</div>
<div class="filter-btn" data-filter="new" id="newFilter">Новое</div>
</div>

<div class="cards" id="placesContainer"></div>
</div>

<div class="bottom-nav">
<div class="nav-item active">🏠<br>Главная</div>
<div class="nav-item">🗺<br>Карта</div>
<div class="nav-item">❤️<br>Избранное</div>
<div class="nav-item">👤<br>Профиль</div>
</div>

<div id="mapScreen">
<div id="closeMapBtn">← Назад</div>
<div id="fullMap"></div>
</div>

<script>
Telegram.WebApp.expand();

const API_BASE="https://city-places-app-production.up.railway.app";
const telegramId=Telegram.WebApp.initDataUnsafe?.user?.id;

let previewMap, fullMap, previewMarkers, fullMarkers;
let activeFilter = "all";

function isNew(createdAt){
const now=new Date();
const created=new Date(createdAt);
return (now-created)/(1000*60*60*24)<=14;
}

function loadPlaces(){
fetch(API_BASE+"/places_with_vote",{headers:{"telegram-id":telegramId}})
.then(res=>res.json())
.then(data=>{

let newPlaces=data.filter(p=>p.created_at&&isNew(p.created_at));
const newBtn=document.getElementById("newFilter");

if(newPlaces.length>0&&activeFilter!=="new"){
newBtn.classList.add("new-glow");
}else{
newBtn.classList.remove("new-glow");
}

if(activeFilter==="new"){
data=newPlaces.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
if(activeFilter==="popular"){
data=data.sort((a,b)=>(b.rating||0)-(a.rating||0));
}

previewMarkers?.clearLayers();
fullMarkers?.clearLayers();

const container=document.getElementById("placesContainer");
container.innerHTML="";

data.forEach(place=>{

let ratingClass="neutral";
if(place.rating>0) ratingClass="positive";
if(place.rating<0) ratingClass="negative";

let upActive=place.user_vote===1?"active-up":"";
let downActive=place.user_vote===-1?"active-down":"";

container.innerHTML+=`
<div class="card">
<div class="rating ${ratingClass}">${place.rating||0}°</div>
<div class="favorite" onclick="toggleFavorite(${place.id},this)">❤️</div>

<div class="img-wrapper">
<img src="${place.image||''}">
<div class="img-gradient"></div>
</div>

<div style="padding:12px">
<h3>${place.name}</h3>
<p>💰 ${place.average_price||"-"} ₽</p>
<p>📍 ${place.street||"-"}</p>
<p>🏷 ${place.type||"-"}</p>
<p>⏰ ${place.work_time||"-"}</p>

<div class="vote-buttons">
<button class="vote-btn ${upActive}" onclick="vote(${place.id},1)">⬆</button>
<button class="vote-btn ${downActive}" onclick="vote(${place.id},-1)">⬇</button>
</div>
</div>
</div>`;
});

});
}

function vote(id,value){
fetch(API_BASE+`/places/${id}/vote?value=`+value,{
method:"POST",
headers:{"telegram-id":telegramId}
}).then(()=>loadPlaces());
}

function toggleFavorite(id,el){
fetch(API_BASE+`/places/${id}/favorite`,{
method:"POST",
headers:{"telegram-id":telegramId}
}).then(()=>{el.classList.toggle("active");});
}

document.querySelectorAll(".filter-btn").forEach(btn=>{
btn.onclick=function(){
activeFilter=this.dataset.filter;
document.querySelectorAll(".filter-btn")
.forEach(b=>b.classList.remove("active"));
this.classList.add("active");
if(activeFilter==="new"){
document.getElementById("newFilter").classList.remove("new-glow");
}
loadPlaces();
}
});

loadPlaces();
</script>

</body>
</html>
